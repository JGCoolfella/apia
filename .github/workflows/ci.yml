name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit tests (data pipeline, hours, search)
        run: npx playwright test --project=unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test --project=browser

      # A real gate: this fails the build if the snapshot is stale, was produced
      # by an older pipeline, or has broken geometry.
      - name: Validate the committed dataset
        run: npm run check

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
