name: Refresh OpenStreetMap data

# Keeps the committed snapshot current. OpenStreetMap in Samoa changes steadily —
# new businesses, corrected names, the Savalalo terminal rebuild — so a map built
# once and left alone goes stale within months.
#
# Runs weekly, and on demand from the Actions tab.

on:
  schedule:
    - cron: '0 15 * * 1'   # Mondays 15:00 UTC = Tuesday 04:00 in Apia (UTC+13)
  workflow_dispatch:
  # Also bootstraps a branch that has no snapshot yet, so a fresh clone is never
  # left with an empty map. See the guard below: on push it is a no-op once
  # public/data/apia.geojson exists.
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to fetch
        id: decide
        run: |
          # Scheduled and manual runs always refresh. A push refreshes only when
          # there is nothing to refresh from, or when the extraction pipeline
          # itself has changed and the committed snapshot is the wrong shape.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ ! -f public/data/apia.geojson ] || [ ! -f public/data/meta.json ]; then
            echo "No snapshot committed yet - bootstrapping."
            echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0
          fi

          WANT=$(grep -oP 'PIPELINE_VERSION\s*=\s*\K\d+' src/config.js)
          HAVE=$(grep -oP '"pipeline_version"\s*:\s*\K\d+' public/data/meta.json || echo 0)
          if [ "$WANT" != "$HAVE" ]; then
            echo "Snapshot was built by pipeline v$HAVE, code is v$WANT - rebuilding."
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo "Snapshot is current (pipeline v$HAVE); nothing to do."
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: steps.decide.outputs.run == 'true'

      - name: Fetch the Apia area from Overpass
        if: steps.decide.outputs.run == 'true'
        run: npm run fetch:data

      - name: Validate what came back
        if: steps.decide.outputs.run == 'true'
        run: npm run check

      - name: Commit if anything changed
        if: steps.decide.outputs.run == 'true'
        run: |
          # `git diff` ignores untracked files, so on the very first run — when
          # the snapshot does not exist yet — it reports "no change" and the new
          # dataset is silently thrown away. `git status --porcelain` sees both.
          if [ -z "$(git status --porcelain -- public/data/)" ]; then
            echo "No change in the OpenStreetMap data for Apia."
            exit 0
          fi

          COUNT=$(node -e "console.log(require('./public/data/meta.json').feature_count)")
          OSM_TS=$(node -e "console.log(require('./public/data/meta.json').osm_data_timestamp)")

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/apia.geojson public/data/meta.json
          git commit -m "data: refresh Apia OpenStreetMap snapshot

          ${COUNT} places, OSM data as of ${OSM_TS}."
          # Two workflows (data refresh, basemap fetch) can land on the same
          # branch from the same push, so a plain `git push` races. Rebase our
          # commit onto whatever arrived meanwhile and retry.
          for attempt in 1 2 3; do
            git push && break
            echo "Push rejected (attempt $attempt) - rebasing onto the remote and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
